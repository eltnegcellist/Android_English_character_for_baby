name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
          cache-disabled: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 37.1 and Build Tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.1" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.1/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"

      - name: Download pinned sherpa-onnx Android runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/libs
          curl -fL --retry 3 --retry-delay 2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-static-link-onnxruntime-1.13.8.aar \
            -o app/libs/sherpa-onnx-static-1.13.8.aar
          echo "b22c3fc1b6a45666d28892bb2f7694beeb77a8362d7ebd77c1a5431ec9435471  app/libs/sherpa-onnx-static-1.13.8.aar" | sha256sum --check

      - name: Validate Android PNG resources
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, struct, zlib
          signature = b"\x89PNG\r\n\x1a\n"

          def validate_png(path):
              data = path.read_bytes()
              if not data.startswith(signature):
                  raise RuntimeError(f"{path}: invalid PNG signature")
              pos = len(signature)
              saw_iend = False
              while pos < len(data):
                  if pos + 12 > len(data):
                      raise RuntimeError(f"{path}: truncated PNG chunk header")
                  length = struct.unpack(">I", data[pos:pos+4])[0]
                  ctype = data[pos+4:pos+8]
                  end = pos + 12 + length
                  if end > len(data):
                      raise RuntimeError(f"{path}: truncated {ctype!r} chunk")
                  payload = data[pos+8:pos+8+length]
                  expected = struct.unpack(">I", data[pos+8+length:pos+12+length])[0]
                  actual = zlib.crc32(ctype + payload) & 0xffffffff
                  if actual != expected:
                      raise RuntimeError(f"{path}: CRC mismatch in {ctype!r}")
                  pos = end
                  if ctype == b"IEND":
                      saw_iend = True
                      break
              if not saw_iend:
                  raise RuntimeError(f"{path}: missing IEND")
              if pos != len(data):
                  raise RuntimeError(f"{path}: unexpected trailing bytes")

          files = list(pathlib.Path("app/src/main/res").rglob("*.png"))
          for path in files:
              validate_png(path)
              print("valid PNG:", path)
          print(f"Validated {len(files)} PNG resource(s)")
          PY

      - name: Test and build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Prepare and verify APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          OUT="app/build/outputs/apk/debug"
          SOURCE="$OUT/app-debug.apk"
          APK="$OUT/Mitsukotoba-v1.9.18-beta1-android-arm-debug.apk"
          cp "$SOURCE" "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > "$APK.apksigner.txt"
          sha256sum "$APK" | tee "$APK.sha256"
          unzip -l "$APK" | grep -q "res/mipmap-anydpi-v26/ic_launcher.xml"
          unzip -l "$APK" | grep -q "res/mipmap-anydpi-v26/ic_launcher_round.xml"
          echo "Verified packaged adaptive launcher icon resources."
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mitsukotoba-v1.9.18-beta1
          path: |
            ${{ steps.apk.outputs.apk }}
            ${{ steps.apk.outputs.apk }}.sha256
            ${{ steps.apk.outputs.apk }}.apksigner.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Publish avatar-color beta release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="mitsukotoba-v1.9.18-beta1"
          APK="${{ steps.apk.outputs.apk }}"
          HASH="$APK.sha256"
          CERT="$APK.apksigner.txt"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Stable release $TAG already exists; leaving it unchanged."
            exit 0
          fi

          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi

          gh release create "$TAG" "$APK" "$HASH" "$CERT" \
            --verify-tag \
            --prerelease \
            --title "みつことば v1.9.18-beta1" \
            --notes "Mitsukotoba v1.9.18-beta1 restores appearance settings for all 12 illustrated expression frames and adds a visible face outline on white backgrounds."
