name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
          cache-disabled: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 37.1 and Build Tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.1" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.1/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"

      - name: Download pinned sherpa-onnx Android runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/libs
          curl -fL --retry 3 --retry-delay 2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-static-link-onnxruntime-1.13.8.aar \
            -o app/libs/sherpa-onnx-static-1.13.8.aar
          echo "b22c3fc1b6a45666d28892bb2f7694beeb77a8362d7ebd77c1a5431ec9435471  app/libs/sherpa-onnx-static-1.13.8.aar" | sha256sum --check

      - name: Test and build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Prepare and verify APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          OUT="app/build/outputs/apk/debug"
          SOURCE="$OUT/app-debug.apk"
          APK="$OUT/EmmaLocal-v1.4.3-android-arm-debug.apk"
          cp "$SOURCE" "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > "$APK.apksigner.txt"
          sha256sum "$APK" | tee "$APK.sha256"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: EmmaLocal-v1.4.0
          path: |
            ${{ steps.apk.outputs.apk }}
            ${{ steps.apk.outputs.apk }}.sha256
            ${{ steps.apk.outputs.apk }}.apksigner.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Publish stable public release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="emma-v1.4.3"
          APK="${{ steps.apk.outputs.apk }}"
          HASH="$APK.sha256"
          CERT="$APK.apksigner.txt"

          git tag -f "$TAG" "$GITHUB_SHA"
          git push origin --force "refs/tags/$TAG"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$HASH" "$CERT" --clobber
            gh release edit "$TAG" \
              --prerelease=false \
              --latest \
              --title "Emma v1.4.0" \
              --notes "Stable v1.4.3 application baseline for physical Android devices (arm64-v8a + armeabi-v7a; x86/x86_64 omitted). The distributed APK is still CI debug-signed."
          else
            gh release create "$TAG" "$APK" "$HASH" "$CERT" \
              --verify-tag \
              --latest \
              --title "Emma v1.4.0" \
              --notes "Stable v1.4.3 application baseline for physical Android devices (arm64-v8a + armeabi-v7a; x86/x86_64 omitted). The distributed APK is still CI debug-signed."
          fi
