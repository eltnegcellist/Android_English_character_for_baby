name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
          cache-disabled: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 37.1 and Build Tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.1" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.1/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"


      - name: Test and build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Verify full ONNX Runtime is packaged
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -p "$APK" "lib/arm64-v8a/libonnxruntime.so" > /tmp/libonnxruntime.so
          unzip -p "$APK" "lib/arm64-v8a/libonnxruntime4j_jni.so" > /tmp/libonnxruntime4j_jni.so
          ORT_SIZE="$(stat -c%s /tmp/libonnxruntime.so)"
          JNI_SIZE="$(stat -c%s /tmp/libonnxruntime4j_jni.so)"
          echo "Packaged libonnxruntime.so: $ORT_SIZE bytes"
          echo "Packaged libonnxruntime4j_jni.so: $JNI_SIZE bytes"
          # Moonshine ships a ~6.5 MB minimal ORT that cannot load arbitrary .onnx.
          # Kitten requires the full same-version ORT from onnxruntime-android.
          test "$ORT_SIZE" -gt 8000000
          test "$JNI_SIZE" -gt 100000

      - name: Prepare and verify APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          OUT="app/build/outputs/apk/debug"
          SOURCE="$OUT/app-debug.apk"
          APK="$OUT/Mitsukotoba-v1.7.0-android-arm-debug.apk"
          cp "$SOURCE" "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > "$APK.apksigner.txt"
          sha256sum "$APK" | tee "$APK.sha256"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mitsukotoba-v1.7.0
          path: |
            ${{ steps.apk.outputs.apk }}
            ${{ steps.apk.outputs.apk }}.sha256
            ${{ steps.apk.outputs.apk }}.apksigner.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Publish stable public release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="mitsukotoba-v1.7.0"
          APK="${{ steps.apk.outputs.apk }}"
          HASH="$APK.sha256"
          CERT="$APK.apksigner.txt"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Stable release $TAG already exists; leaving it unchanged."
            exit 0
          fi

          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi

          gh release create "$TAG" "$APK" "$HASH" "$CERT" \
            --verify-tag \
            --latest \
            --title "みつことば v1.7.0" \
            --notes "Mitsukotoba v1.7.0 restores Emma as the default configurable AI character, adds first-turn self-introduction and a manual force-reply control that ends the current listening turn immediately. It also documents optional plush-character use for families who prefer not to show the display. Physical Android devices only (arm64-v8a + armeabi-v7a; x86/x86_64 omitted). The distributed APK is still CI debug-signed."
