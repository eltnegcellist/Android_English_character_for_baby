name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
          cache-disabled: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android 17 platform
        shell: bash
        run: |
          set -euo pipefail
          android sdk install platforms/android-37

      - name: Download pinned sherpa-onnx Android runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/libs
          curl -fL --retry 3 --retry-delay 2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.7/sherpa-onnx-static-link-onnxruntime-1.13.7.aar \
            -o app/libs/sherpa-onnx-static-1.13.7.aar
          echo "220d7cb25ac6e57ec34082bc2551ebd7ec7d4d96cbfea520839e208f92347837  app/libs/sherpa-onnx-static-1.13.7.aar" | sha256sum --check

      - name: Test and build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Prepare APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          OUT="app/build/outputs/apk/debug"
          SOURCE="$OUT/app-debug.apk"
          APK="$OUT/EmmaLocal-v1.4.0-beta3-universal-debug.apk"
          cp "$SOURCE" "$APK"
          sha256sum "$APK" | tee "$APK.sha256"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: EmmaLocal-v1.4.0-beta3
          path: |
            ${{ steps.apk.outputs.apk }}
            ${{ steps.apk.outputs.apk }}.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Publish public preview release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="emma-v1.4.0-beta3-public"
          APK="${{ steps.apk.outputs.apk }}"
          HASH="$APK.sha256"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --cleanup-tag --yes
          fi

          gh release create "$TAG" "$APK" "$HASH" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Emma v1.4.0-beta3" \
            --notes "Public preview build from main. This APK uses the standard debug signing key generated by the GitHub runner."
