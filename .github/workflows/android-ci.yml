name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify shared topic source and generated help
        run: |
          python3 scripts/sync-lite-topic-contract.py --check
          python3 scripts/generate-lite-topic-contract.py --target android --check
          python3 scripts/test-lite-topic-contract.py
          python3 scripts/verify-play-topics.py

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
          cache-disabled: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 37.1 and Build Tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.1" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.1/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"

      - name: Prepare Moonshine AAR without reduced ONNX Runtime
        shell: bash
        run: |
          chmod +x scripts/prepare-moonshine-android-aar.sh
          scripts/prepare-moonshine-android-aar.sh

      - name: Validate Android PNG resources
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, struct, zlib
          signature = b"\x89PNG\r\n\x1a\n"

          def validate_png(path):
              data = path.read_bytes()
              if not data.startswith(signature):
                  raise RuntimeError(f"{path}: invalid PNG signature")
              pos = len(signature)
              saw_iend = False
              while pos < len(data):
                  if pos + 12 > len(data):
                      raise RuntimeError(f"{path}: truncated PNG chunk header")
                  length = struct.unpack(">I", data[pos:pos+4])[0]
                  ctype = data[pos+4:pos+8]
                  end = pos + 12 + length
                  if end > len(data):
                      raise RuntimeError(f"{path}: truncated {ctype!r} chunk")
                  payload = data[pos+8:pos+8+length]
                  expected = struct.unpack(">I", data[pos+8+length:pos+12+length])[0]
                  actual = zlib.crc32(ctype + payload) & 0xffffffff
                  if actual != expected:
                      raise RuntimeError(f"{path}: CRC mismatch in {ctype!r}")
                  pos = end
                  if ctype == b"IEND":
                      saw_iend = True
                      break
              if not saw_iend:
                  raise RuntimeError(f"{path}: missing IEND")
              if pos != len(data):
                  raise RuntimeError(f"{path}: unexpected trailing bytes")

          files = list(pathlib.Path("app/src/main/res").rglob("*.png"))
          for path in files:
              validate_png(path)
              print("valid PNG:", path)
          print(f"Validated {len(files)} PNG resource(s)")
          PY

      - name: Reject GPL/eSpeak/sherpa TTS regressions
        shell: bash
        run: |
          set -euo pipefail
          banned='espeak-ng-data|com\.k2fsa\.sherpa|sherpa-onnx-static|OfflineTtsKittenModelConfig'
          if grep -RniE "$banned" app/src app/build.gradle.kts \
              --exclude='LICENSE_AUDIT.md' --exclude='THIRD_PARTY_NOTICES.md'; then
            echo "GPL/eSpeak or sherpa TTS regression detected."
            exit 1
          fi

      - name: Test and build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Prepare and verify APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          OUT="app/build/outputs/apk/debug"
          SOURCE="$OUT/app-debug.apk"
          APK="$OUT/Mitsukotoba-v1.9.26-android-arm-debug.apk"
          cp "$SOURCE" "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > "$APK.apksigner.txt"
          sha256sum "$APK" | tee "$APK.sha256"
          unzip -l "$APK" | grep -q "res/mipmap-anydpi-v26/ic_launcher.xml"
          unzip -l "$APK" | grep -q "res/mipmap-anydpi-v26/ic_launcher_round.xml"
          if unzip -l "$APK" | grep -Eiq 'espeak|sherpa'; then
            echo "Unexpected eSpeak/sherpa file found in APK."
            unzip -l "$APK" | grep -Ei 'espeak|sherpa' || true
            exit 1
          fi
          # Both Moonshine Voice and the Java ONNX Runtime AAR provide
          # libonnxruntime.so. The APK must contain the official full ORT build,
          # not Moonshine's reduced operator build, because Kitten needs the full
          # operator set.
          ORT_AAR="$RUNNER_TEMP/onnxruntime-android-1.23.2.aar"
          curl -fL --retry 3 --retry-delay 2 \
            https://repo1.maven.org/maven2/com/microsoft/onnxruntime/onnxruntime-android/1.23.2/onnxruntime-android-1.23.2.aar \
            -o "$ORT_AAR"
          for ABI in arm64-v8a armeabi-v7a; do
            unzip -p "$ORT_AAR" "jni/$ABI/libonnxruntime.so" > "$RUNNER_TEMP/official-$ABI-libonnxruntime.so"
            unzip -p "$APK" "lib/$ABI/libonnxruntime.so" > "$RUNNER_TEMP/apk-$ABI-libonnxruntime.so"
            OFFICIAL_SIZE="$(stat -c%s "$RUNNER_TEMP/official-$ABI-libonnxruntime.so")"
            APK_SIZE="$(stat -c%s "$RUNNER_TEMP/apk-$ABI-libonnxruntime.so")"
            echo "$ABI ORT sizes: official=$OFFICIAL_SIZE apk=$APK_SIZE"

            # AGP strips native symbols while packaging, so a byte-for-byte compare
            # is not stable. Moonshine's reduced ORT is only ~30% of the stock
            # library; requiring >=70% of the official AAR cleanly distinguishes
            # the stock operator set while allowing normal symbol stripping.
            test $((APK_SIZE * 100)) -ge $((OFFICIAL_SIZE * 70))
            strings "$RUNNER_TEMP/apk-$ABI-libonnxruntime.so" | grep -q 'VERS_1\.23\.2'
            echo "Verified stock-sized ONNX Runtime 1.23.2 for $ABI."
          done
          rm -rf "$RUNNER_TEMP/mitsukotoba-apk-scan"
          mkdir -p "$RUNNER_TEMP/mitsukotoba-apk-scan"
          unzip -q "$APK" 'classes*.dex' -d "$RUNNER_TEMP/mitsukotoba-apk-scan"
          if find "$RUNNER_TEMP/mitsukotoba-apk-scan" -type f -name 'classes*.dex' -print0 | \
              xargs -0 strings | grep -Eiq 'espeak-ng-data|com/k2fsa/sherpa|sherpa-onnx'; then
            echo "Unexpected eSpeak/sherpa reference found in DEX."
            exit 1
          fi
          echo "Verified adaptive icons and no eSpeak/sherpa TTS payload."
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mitsukotoba-v1.9.26
          path: |
            ${{ steps.apk.outputs.apk }}
            ${{ steps.apk.outputs.apk }}.sha256
            ${{ steps.apk.outputs.apk }}.apksigner.txt
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

      - name: Publish stable public release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="mitsukotoba-v1.9.26"
          APK="${{ steps.apk.outputs.apk }}"
          HASH="$APK.sha256"
          CERT="$APK.apksigner.txt"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Stable release $TAG already exists; leaving it unchanged."
            exit 0
          fi

          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi

          gh release create "$TAG" "$APK" "$HASH" "$CERT" \
            --verify-tag \
            --latest \
            --title "みつことば v1.9.26" \
            --notes "Mitsukotoba v1.9.26 removes white/black/red mode and defaults to vivid Coral red. Previous white/black/red settings migrate to Coral. Color shift smoothly cycles through vivid Coral, Honey, Blue, and Berry accents while keeping the face and body white. Web uses the same colors and interpolation. Retains shared topic tests, offline help, and non-GPL Kitten TTS."
