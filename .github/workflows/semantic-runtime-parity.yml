name: Semantic Runtime Parity

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/src/main/java/com/eltnegcellist/emma/ai/RuriSemanticClassifier.kt'
      - 'app/src/main/java/com/eltnegcellist/emma/ai/RuriSemanticTokenizer.kt'
      - 'app/src/main/java/com/eltnegcellist/emma/ai/RuriSemanticModelStore.kt'
      - 'semantic-parity-host/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/semantic-runtime-parity.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/src/main/java/com/eltnegcellist/emma/ai/RuriSemanticClassifier.kt'
      - 'app/src/main/java/com/eltnegcellist/emma/ai/RuriSemanticTokenizer.kt'
      - 'app/src/main/java/com/eltnegcellist/emma/ai/RuriSemanticModelStore.kt'
      - 'semantic-parity-host/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/semantic-runtime-parity.yml'

permissions:
  contents: read

concurrency:
  group: semantic-runtime-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Android
        uses: actions/checkout@v5

      - name: Checkout Web Semantic runtime
        uses: actions/checkout@v5
        with:
          repository: eltnegcellist/Web_EmmaLocal_English_for_babies
          ref: main
          path: .web-parity

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
          cache-disabled: true

      - name: Compare actual Android and Web Semantic inference
        shell: bash
        run: |
          set -euo pipefail
          echo "Android parity revision: $GITHUB_SHA"
          echo "Web parity revision: $(git -C .web-parity rev-parse HEAD)"
          node .web-parity/scripts/semantic-parity-web.mjs --output .semantic-parity/web.json
          WEB_ROOT="$PWD/.web-parity"
          gradle --no-daemon :semantic-parity-host:run --stacktrace --args="--web $WEB_ROOT/.semantic-parity/web.json --model $WEB_ROOT/semantic-assets/ruri70-int8-bd500193/model.onnx --tokenizer $WEB_ROOT/semantic-assets/ruri70-int8-bd500193/tokenizer.json --head $WEB_ROOT/semantic-assets/ruri70-int8-bd500193/head-topic.f32 --output $PWD/build/semantic-parity/android-vs-web.json"
          cat build/semantic-parity/android-vs-web.json

      - name: Upload Semantic parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-runtime-parity
          path: build/semantic-parity/android-vs-web.json
          if-no-files-found: warn
          retention-days: 2
