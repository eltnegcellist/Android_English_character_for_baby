name: Shared topic contract drift

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check generated guide and fixtures
        run: python3 scripts/generate-lite-topic-contract.py --target android --check
      - name: Detect changes in the canonical Web contract
        run: python3 scripts/sync-lite-topic-contract.py --check-latest
